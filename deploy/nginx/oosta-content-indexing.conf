# Home, product catalog, blog index and blog posts can be indexed while
# preview write restrictions apply (owner approved 2026-11-17).
# Matches only these exact paths (query strings are ignored by location matching):
#   /fa  /en  /fa/products  /en/products  /fa/blog  /en/blog  /fa/blog/<slug>  /en/blog/<slug>
# Everything else (login, dashboard, support, checkout, admin, API, CMS pages)
# keeps the server-wide "noindex, nofollow".
location ~ "^/(?:fa|en)(?:/products|/blog(?:/[a-z0-9][a-z0-9-]{0,119})?)?$" {
  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 503; }
  add_header X-Robots-Tag "index, follow" always;
  add_header X-Oosta-Mode "preview-read-only" always;
  add_header Cache-Control "private, no-store" always;
  proxy_pass http://127.0.0.1:3400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
}
