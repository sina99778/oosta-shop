# Selective live wallet checkout; legacy purchase/payment writes retain preview restrictions.
location ~ "^/api/supplier-checkout/(?:quotes|orders)$" {
  if ($scheme != https) { return 503; }
  if ($request_method != POST) { return 405; }
  client_max_body_size 4k;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}

location = /api/auth/signup {
  if ($scheme != https) { return 503; }
  if ($request_method != POST) { return 405; }
  client_max_body_size 4k;
  proxy_pass http://127.0.0.1:4400/auth/signup;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}

location ~ "^/api/orders/[a-z0-9]{1,100}/receipt$" {
  if ($scheme != https) { return 503; }
  if ($request_method != POST) { return 405; }
  client_max_body_size 6m;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
