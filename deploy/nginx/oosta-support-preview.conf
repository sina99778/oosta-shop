# Customer tickets and staff responses. Express checks ownership, current roles and request bodies.
location ~ "^/api/(?:tickets(?:/[a-z0-9]{1,100}/messages)?|admin/tickets/[a-z0-9]{1,100}/(?:messages|status))$" {
  if ($scheme != https) { return 503; }
  if ($request_method !~ ^(GET|HEAD|OPTIONS|POST)$) { return 405; }
  client_max_body_size 32k;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
