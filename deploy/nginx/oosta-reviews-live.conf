# Verified buyers write reviews. Review publication and deletion require the current admin role.
location ~ "^/api/(?:products/[a-z0-9]{1,100}/reviews|admin/reviews/[a-z0-9]{1,100}(?:/(?:approve|reject))?)$" {
  if ($scheme != https) { return 503; }
  if ($request_method !~ ^(POST|DELETE)$) { return 405; }
  client_max_body_size 32k;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
