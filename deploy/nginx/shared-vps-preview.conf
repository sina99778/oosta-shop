# Host Nginx preview: no sales or account mutations until live setup is complete.
# Install only as a new site; existing server blocks remain in place.
server {
  listen 80;
  # Enable these after certbot certonly --webroot has issued the origin certificate.
  # listen 443 ssl;
  # ssl_certificate /etc/letsencrypt/live/oostaai.store/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/oostaai.store/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name oostaai.store 91.107.254.140;
  client_max_body_size 6m;
  # Install deploy/nginx/trusted-cdn.conf at this path for this site only.
  include /etc/nginx/oosta-trusted-cdn.conf;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Oosta-Mode "preview-read-only" always;
  add_header Cache-Control "private, no-store" always;

  location ^~ /.well-known/acme-challenge/ {
    root /var/lib/oosta-acme;
  }

  # Let the bootstrapped administrator sign in; registration and all other writes stay closed.
  location = /api/auth/login {
    default_type application/json;
    # Do not accept credentials over plaintext, including an HTTP CDN-to-origin hop.
    if ($scheme != https) {
      return 503 '{"error":{"code":"SECURE_LOGIN_UNAVAILABLE","message":"Secure administrator access is being configured. Please try later."}}';
    }
    if ($request_method != POST) { return 405; }
    proxy_pass http://127.0.0.1:4400/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Ar-Real-IP "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header X-Country-Code "";
  }

  # Bounded operator-funded QA only: API enforces current ADMIN role and private spending authorization.
  location ~ "^/api/admin/suppliers/qa/attempts(?:/[a-z0-9]{1,100}/reconcile)?$" {
    default_type application/json;
    if ($scheme != https) { return 503 '{"error":{"code":"SECURE_QA_UNAVAILABLE","message":"HTTPS is required for supplier QA."}}'; }
    if ($request_method != POST) { return 405; }
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:4400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Ar-Real-IP "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header X-Country-Code "";
  }

  # On an installed preview, include oosta-admin-catalog-preview.conf here
  # when the operator is preparing inventory and product drafts.
  # Include oosta-static-assets.conf here to honor immutable cache headers for Next assets.
  # Include oosta-auth-session-preview.conf here to enable approved HTTPS session and recovery routes.
  # Include oosta-reviews-live.conf here after the verified-buyer review API is deployed.
  # After explicit approval, include oosta-product-indexing.conf to index product detail pages.
  # After explicit approval, include oosta-content-indexing.conf to index home, catalog and blog.
  location /api/ {
    default_type application/json;
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
      return 503 '{"error":{"code":"PREVIEW_READ_ONLY","message":"Store setup is in progress. Purchases are not enabled."}}';
    }
    proxy_pass http://127.0.0.1:4400/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Ar-Real-IP "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header X-Country-Code "";
  }

  location / {
    # Next server actions must not bypass the API's preview write restriction.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 503; }
    proxy_pass http://127.0.0.1:3400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Ar-Real-IP "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header X-Country-Code "";
  }
}
