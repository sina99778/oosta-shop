# Public product detail pages can be indexed while preview write restrictions apply.
location ~ "^/(?:fa|en)/products/[a-z0-9][a-z0-9-]{0,99}$" {
  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 503; }
  add_header X-Robots-Tag "index, follow" always;
  add_header X-Oosta-Mode "preview-read-only" always;
  add_header Cache-Control "private, no-store" always;
  proxy_pass http://127.0.0.1:3400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
