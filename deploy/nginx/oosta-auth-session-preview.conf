# Sign-out, password change and email-based password recovery.
# Without this the read-only preview returns 503 and logout cannot clear the httpOnly cookie.
# Express checks browser origins and requires either an account session or a reset
# token where applicable. Password change and reset requests are rate-limited there.
location ~ "^/api/auth/(?:logout|logout-all|change-password|forgot-password|reset-password|recovery-email/(?:request|verify)|sessions/revoke-others)$" {
  default_type application/json;
  if ($scheme != https) { return 503; }
  if ($request_method != POST) { return 405; }
  client_max_body_size 4k;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}

location ~ "^/api/auth/sessions/[A-Za-z0-9_-]{8,64}$" {
  if ($scheme != https) { return 503; }
  if ($request_method != DELETE) { return 405; }
  client_max_body_size 4k;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
