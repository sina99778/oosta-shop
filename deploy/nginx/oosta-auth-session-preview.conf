# Session management for signed-in accounts: sign out, sign out everywhere, change password.
# Without this the read-only preview returns 503 and logout cannot clear the httpOnly cookie.
# Express requires an authenticated session (except logout), checks the Origin of cookie
# writes against PUBLIC_ORIGIN, rate-limits password changes and rejects API keys here.
location ~ "^/api/auth/(?:logout|logout-all|change-password)$" {
  default_type application/json;
  if ($scheme != https) { return 503; }
  if ($request_method != POST) { return 405; }
  client_max_body_size 4k;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
}
