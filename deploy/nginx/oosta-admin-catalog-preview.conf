# Prepare categories, products, plans and inventory through the authenticated admin API.
location ~ "^/api/admin/(?:categories|products(?:/[a-z0-9]{1,100}(?:/plans|/images?)?)?|plans/[a-z0-9]{1,100}|inventory/bulk|suppliers/(?:pricing|[a-z0-9-]+/sync))$" {
  if ($scheme != https) { return 503; }
  if ($request_method !~ ^(GET|HEAD|OPTIONS|POST|PATCH)$) { return 405; }
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
