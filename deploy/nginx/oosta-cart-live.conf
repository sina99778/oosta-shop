location ~ "^/(?:fa|en)/cart(?:/.*)?$" {
  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
  proxy_pass http://127.0.0.1:3400;
  proxy_http_version 1.1;
  proxy_hide_header Cache-Control;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}

location ~ "^/api/cart/items(?:/[A-Za-z0-9_-]{1,100}/(?:review|pay))?$" {
  if ($scheme != https) { return 503; }
  if ($request_method != POST) { return 405; }
  client_max_body_size 4k;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_next_upstream off;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}

location ~ "^/api/cart/items/[A-Za-z0-9_-]{1,100}$" {
  if ($scheme != https) { return 503; }
  if ($request_method != DELETE) { return 405; }
  client_max_body_size 4k;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_next_upstream off;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
