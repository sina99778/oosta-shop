# Public page-view beacon (components/track.tsx -> analytics.routes.ts POST /track).
# Without this, the preview's read-only /api/ block answered 503 and no visit was
# ever stored. The API drops bot user agents, keeps only the pathname, stores a
# daily-rotating sha256 visitor hash (no raw IP) and prunes rows after 90 days.
# Needs oosta-track-limit.http.conf in the http context.
location = /api/track {
  default_type application/json;
  if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
  limit_req zone=oosta_track_ip burst=20 nodelay;
  limit_req_status 429;
  client_max_body_size 2k;
  proxy_pass http://127.0.0.1:4400/track;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
