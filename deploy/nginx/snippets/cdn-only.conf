# Accept traffic ONLY from the CDN (ArvanCloud) edge — include this inside the
# server block once the domain is proxied through Arvan.
#
# Why: the API trusts X-Forwarded-For from 2 proxy hops (TRUST_PROXY_HOPS=2) to
# find the visitor's real IP for rate limiting. A client hitting the server IP
# directly could send a fake X-Forwarded-For and dodge the login/brute-force
# limits. Allowing only the CDN's ranges closes that.
#
# Keep this list current with https://www.arvancloud.ir/fa/ips.txt — e.g. regenerate:
#   curl -s https://www.arvancloud.ir/fa/ips.txt | sed 's/.*/allow &;/' > deploy/nginx/snippets/cdn-allow.list
include /etc/nginx/snippets/cdn-allow.list;
allow 127.0.0.1;
deny all;
