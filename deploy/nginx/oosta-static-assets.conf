# Next's fingerprinted frontend assets may keep their upstream immutable cache header.
# Defining these two headers here prevents inheritance of the site's private no-store header.
location ~ "^/api/(?:products/[a-z0-9-]{1,100}/image|product-images/[a-z0-9-]{1,100})$" {
  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Oosta-Mode "preview-read-only" always;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}

location ~ "^/_next/static/(?:chunks/[a-zA-Z0-9_.~-]+\.(?:js|css)|media/[a-zA-Z0-9_.~-]+\.(?:woff2?|ttf))$" {
  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Oosta-Mode "preview-read-only" always;
  proxy_pass http://127.0.0.1:3400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}

location ~ "^/brand/oosta-(?:hero-v1-(?:320|640)|hero-v2-320|mark-v1-96)\.webp$" {
  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Oosta-Mode "preview-read-only" always;
  add_header Cache-Control "public, max-age=31536000, immutable";
  proxy_hide_header Cache-Control;
  proxy_pass http://127.0.0.1:3400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
