# http-level companion of oosta-visit-tracking.conf (install in /etc/nginx/conf.d/).
# Rate-limit key for the public page-view beacon: the visitor IP from ArvanCloud's
# ar-real-ip header, trusted ONLY when the connection comes from an ArvanCloud edge
# (ranges copied from trusted-cdn.conf); otherwise the connecting address.
geo $oosta_from_cdn {
  default 0;
  185.143.232.0/22 1;
  188.229.116.16/30 1;
  94.101.182.0/27 1;
  2.144.3.128/28 1;
  37.32.16.0/27 1;
  37.32.17.0/27 1;
  37.32.18.0/27 1;
  37.32.19.0/27 1;
  185.215.232.0/22 1;
  178.131.120.48/28 1;
  94.101.183.0/28 1;
  78.157.36.112/28 1;
  95.38.61.80/28 1;
  193.24.119.0/29 1;
}
map "$oosta_from_cdn:$http_ar_real_ip" $oosta_track_key {
  "~^1:(?<client>[0-9a-fA-F:.]{3,45})$" $client;
  default $binary_remote_addr;
}
limit_req_zone $oosta_track_key zone=oosta_track:10m rate=60r/m;
