# Authenticated article editing and raster media only. The API validates roles and methods.
location ~ "^/api/admin/blog(?:/[a-z0-9]{1,100}(?:/cover)?)?$" {
  if ($scheme != https) { return 503; }
  if ($request_method !~ ^(GET|HEAD|OPTIONS|POST|PATCH|DELETE)$) { return 405; }
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
