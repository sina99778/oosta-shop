# Only these account mutations bypass storefront preview read-only mode.
location ~ "^/api/auth/(?:stock-alerts/[A-Za-z0-9_-]{1,100}|notifications/read)$" {
  if ($scheme != https) { return 503; }
  if ($request_method !~ "^(GET|HEAD|POST|DELETE|PATCH)$") { return 405; }
  client_max_body_size 4k;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:4400;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Ar-Real-IP "";
  proxy_set_header CF-IPCountry "";
  proxy_set_header X-Country-Code "";
}
