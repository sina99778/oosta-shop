name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @oosta/api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: "1"

  api-tests:
    name: API integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oosta
          POSTGRES_PASSWORD: oosta
          POSTGRES_DB: oosta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oosta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://oosta:oosta@localhost:5432/oosta?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @oosta/api
      - run: npm run prisma:deploy -w @oosta/api
      # The smoke suite expects the seeded catalog, so it runs before the
      # integration tests (which add their own fixtures).
      - run: npm run db:seed -w @oosta/api
      - run: npm run smoke -w @oosta/api
      - run: npm test -w @oosta/api
