name: Quality and isolated commerce checks

on:
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TELEGRAM_BOT_TOKEN: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      PAYMENT_PROVIDER: mock
      DATABASE_URL: postgresql://audit@127.0.0.1:9/unused?schema=public
      JWT_SECRET: synthetic-ci-secret-never-for-deployment
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate -w @oosta/api
      - name: Locate disposable PostgreSQL tools
        run: echo "PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: Verify contracts, security and disposable commerce database
        run: npm run verify
      - name: Lint
        run: npm run lint
      - name: Production builds
        run: npm run build
      - name: Backup runner regressions (synthetic commands)
        run: bash deploy/ops/backup.test.sh
      - name: Production dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev
      - name: Full dependency audit
        if: ${{ !cancelled() }}
        run: npm audit
